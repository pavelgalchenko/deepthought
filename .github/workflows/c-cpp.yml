name: C/C++ CI

# run only on pushes or pull requests to master
# this way you can develop on and push to separate branches without
# using up runner minutes
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-build:
    # Ubuntu and MacOS build in various conditions
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        compiler: [gcc, clang]
        glut: ["GLUT", "GLFW"]
        spice: ["ON", "OFF"]
        build: ["release", "debug"]
        exclude:
          - glut: "GLFW"
            spice: "ON"
          - glut: "GLFW"
            build: "debug"
          # gcc not normally present on mac, unless installed from e.g. homebrew
          - os: "macos-latest"
            compiler: "gcc"

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: install linux dep
        if: ${{ contains(matrix.os, 'ubuntu') }}
        run: sudo apt-get -y install pkg-config libfyaml-dev libglu1-mesa-dev freeglut3-dev mesa-common-dev
      - name: install macos dep
        if: ${{ contains(matrix.os, 'macos') }}
        run: brew install pkgconfig libfyaml freeglut mesa-glu
      - name: get linux GLFW
        if: ${{ (matrix.glut ==  'GLFW') && (contains(matrix.os, 'ubuntu')) }}
        run: sudo apt-get -y install libglfw3-dev
      - name: get macos GLFW
        if: ${{ (matrix.glut ==  'GLFW') && (contains(matrix.os, 'macos')) }}
        run: brew install glfw
      - name: get cspice
        if: ${{ matrix.spice == 'ON' }}
        run: ./download_spice.sh
      - name: set compiler
        run: export CC=$(which ${{ matrix.compiler }})
      - name: cmake
        run: cmake --preset default_${{ matrix.build }} -DSPICE=${{ matrix.spice }} -DGLUT_OR_GLFW=${{ matrix.glut }} .
      - name: cmake
        if: ${{ matrix.glut == 'GLFW' && contains(matrix.os, 'macos') }}
        run: cmake -DCMAKE_PREFIX_PATH=$(brew --prefix) .
      - name: make
        run: make -sj
