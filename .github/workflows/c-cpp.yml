name: C/C++ CI

# run only on pushes or pull requests to master
# this way you can develop on and push to separate branches without
# using up runner minutes
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-ubuntu:
    # Ubuntu build in various conditions
    strategy:
      matrix:
        os: [ubuntu-latest]
        compiler: [gcc, clang]
        glut: ["GLUT", "GLFW"]
        spice: ["ON", "OFF"]
        build: ["release", "debug"]
        exclude:
          - glut: "GLFW"
            spice: "ON"
          - glut: "GLFW"
            build: "debug"

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: install dep
        if: ${{ contains(matrix.os, 'ubuntu') }}
        run: sudo apt-get -y install pkg-config libfyaml-dev libglu1-mesa-dev freeglut3-dev mesa-common-dev
      - name: get GLFW
        if: ${{ (matrix.glut ==  'GLFW') && (contains(matrix.os, 'ubuntu')) }}
        run: sudo apt-get -y install libglfw3-dev
      - name: get cspice
        if: ${{ matrix.spice == 'ON' }}
        run: ./download_spice.sh
      - name: set compiler
        run: export CC=$(which ${{ matrix.compiler }})
      - name: cmake
        run: cmake -DCMAKE_BUILD_TYPE=${{ matrix.build }} -DSPICE=${{ matrix.spice }} -DGLUT_OR_GLFW=${{ matrix.glut }} .
      - name: make
        run: make -sj
